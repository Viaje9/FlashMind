<button
  type="button"
  class="study-note-toggle"
  [class.study-note-toggle-open]="panelOpen()"
  [style.top.px]="toggleTop()"
  (click)="onToggleClick()"
  (pointerdown)="onTogglePointerDown($event)"
  (pointermove)="onTogglePointerMove($event)"
  (pointerup)="onTogglePointerEnd($event)"
  (pointercancel)="onTogglePointerEnd($event)"
  aria-label="開啟卡片備註"
  data-testid="study-note-toggle"
>
  <span class="material-symbols-outlined text-[21px]">sticky_note_2</span>
</button>

@if (panelOpen()) {
  <div class="pointer-events-none fixed inset-0 z-[80]">
    <section
      class="study-note-panel pointer-events-auto"
      role="dialog"
      aria-label="卡片備註"
      data-testid="study-note-panel"
      [style.top.px]="panelTop()"
      [style.height.px]="panelHeight()"
      (pointerdown)="onPanelPointerDown($event)"
      (pointermove)="onPanelPointerMove($event)"
      (pointerup)="onPanelPointerEnd($event)"
      (pointercancel)="onPanelPointerEnd($event)"
    >
      <header class="study-note-header" data-study-note-drag-handle="true">
        <div class="flex min-w-0 items-center gap-2">
          <span class="study-note-title-icon material-symbols-outlined" aria-hidden="true">
            sticky_note_2
          </span>
          <h3 class="truncate text-sm font-bold text-amber-950">卡片備註</h3>
        </div>
        <p class="study-note-current-word truncate text-[11px] text-amber-900/60">
          {{ word() }}
        </p>
        <button
          type="button"
          class="study-note-action"
          (click)="togglePanel()"
          aria-label="關閉卡片備註"
        >
          <span class="material-symbols-outlined text-[19px]">close</span>
        </button>
      </header>

      <textarea
        class="study-note-textarea"
        [value]="draft()"
        (input)="onDraftInput($any($event.target).value)"
        placeholder="記下你的理解、聯想、容易混淆的地方…"
        aria-label="輸入卡片備註"
        data-testid="study-note-input"
      ></textarea>

      <footer class="study-note-footer" aria-live="polite">
        <span
          class="study-note-status"
          [class.study-note-status-saving]="saveStatus() === 'saving'"
          [class.study-note-status-saved]="saveStatus() === 'saved'"
          [class.study-note-status-error]="saveStatus() === 'error'"
        >
          @if (saveStatus() === 'saving') {
            <span class="material-symbols-outlined animate-spin">progress_activity</span>
          } @else if (saveStatus() === 'saved') {
            <span class="material-symbols-outlined">cloud_done</span>
          } @else if (saveStatus() === 'error') {
            <span class="material-symbols-outlined">cloud_off</span>
          } @else {
            <span class="material-symbols-outlined">cloud_sync</span>
          }
          {{ saveStatusText() }}
        </span>
        @if (saveStatus() === 'error') {
          <button type="button" class="study-note-retry" (click)="retrySave()">重試</button>
        }
      </footer>

      <button
        type="button"
        class="study-note-resize"
        (pointerdown)="onResizePointerDown($event)"
        (pointermove)="onResizePointerMove($event)"
        (pointerup)="onResizePointerEnd($event)"
        (pointercancel)="onResizePointerEnd($event)"
        aria-label="調整備註視窗大小"
      >
        <span class="study-note-resize-lines" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
        </span>
      </button>
    </section>
  </div>
}
